<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Changer</title>
    <style>
            *{   transition: all 1s ease; }

            .hide
            {
                display: none;
            }
    </style>
</head>
<body>
    <h2>Image Changer</h2>


    <input type="text" id="inp" placeholder="Enter Image URL">
    <button onclick="change()">Change Image</button>
    <button onclick="rotateImage()">Rotate Image</button>
    <button onclick="hideImage()">Show/Hide Image</button>
    <img src="./MyProfilePictureUsingGemini2.png" alt="" srcset="" id="image" style="height: 200px; width:200px; border: 2px solid black;">

    <script src="./script.js"></script>
</body>
</html>
