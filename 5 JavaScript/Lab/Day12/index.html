<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Progressbar</title>
</head>
<body style="height: 100vh; width: 100vw; display: flex; justify-content: center; align-items: center; flex-direction: column;">
    <h3 id="heading">Loading....</h3>
    <div id="progressContainer" style="height: 2%; width: 30%; border: 2px solid black; border-radius: 50px; display: flex;">
        <div id="progressBar" style="background-color: green; height:100%; width: 0%; border-radius: 50px; display: flex; align-items:center; justify-content: center; padding-left: 5%;"></div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
