<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Building a Simple Image Carousel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body style="width: 100vw; height: 100vh;" class="d-flex align-items-center justify-content-center">
    
    <div class="h-50 w-50 d-flex ">
        <button class="border-0 bg-white" onclick="prev()"><i class="bi bi-caret-left-fill"></i></button>
        <img src="" alt="Image" id="imgs">
        <button class="border-0 bg-white" onclick="next()"><i class="bi bi-caret-right-fill"></i></button>
    </div>
    
    <script src="./script.js"></script>
</body>
</html>
